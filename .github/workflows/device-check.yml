name: Проверка на эмуляторах

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android7-malenkiy
            api: 24
            target: google_apis
            profile: Nexus 5
            font: "1.0"
          - name: android10-sredniy
            api: 29
            target: google_apis
            profile: pixel_3a
            font: "1.0"
          - name: android14-krupnyy-shrift
            api: 34
            target: google_apis
            profile: pixel_6
            font: "1.3"
          - name: android15-ochen-malenkiy
            api: 35
            target: google_apis
            profile: Nexus One
            font: "1.0"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Отладочная сборка
        run: ./gradlew --no-daemon assembleDebug

      - name: Проверка в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            adb shell settings put system font_scale ${{ matrix.font }}
            bash .github/device-check.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-check-${{ matrix.name }}
          path: device-check/

      - name: Сохранить результаты в ветку checks/${{ matrix.name }}
        if: always()
        run: |
          cd device-check
          git init -q -b out
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Проверка ${{ matrix.name }} для ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out:checks/${{ matrix.name }}
